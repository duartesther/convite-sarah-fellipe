/* Art direction: romantic botanical stationery, softly layered like a Canva wedding suite */
:root{--paper:#fbf8f0;--sage:#b7bea2;--sage-dark:#687253;--ink:#464536;--gold:#b69a68;--muted:#817d69;--white:#fffdf8;--blush:#eadfd2;--moss:#879071}
body{background:radial-gradient(ellipse at 12% 12%,#d9d8c8 0,transparent 35%),radial-gradient(ellipse at 90% 85%,#e6d8c8 0,transparent 32%),#e9e4d8}
.site{background-color:var(--paper);background-image:radial-gradient(#b9ad8b13 .7px,transparent .7px),linear-gradient(135deg,#fffdf8,#f7f3e9);background-size:7px 7px,100% 100%;}
.screen{padding-top:42px;padding-bottom:48px}
.envelope-screen{background:radial-gradient(ellipse at 50% 16%,#fffefa 0,#f8f4e9 58%,#eee9dc 100%)}
.envelope-screen:before,.envelope-screen:after{content:'✳';position:absolute;color:#a8ad91;font-size:28px;opacity:.42;font-family:serif}
.envelope-screen:before{left:8%;top:12%;transform:rotate(-18deg)}.envelope-screen:after{right:9%;bottom:13%;font-size:22px;transform:rotate(18deg)}
.monogram{background:linear-gradient(145deg,#fffef9,#f0eadc);box-shadow:0 5px 12px #796d4a18,inset 0 0 0 4px #fbf8f0,inset 0 0 0 5px #d7c7a5;border-color:#b69a68}
.envelope-screen h1{font-size:clamp(46px,11vw,60px);color:#555440;text-shadow:0 1px #fff}
.envelope-screen p{color:#85816d;letter-spacing:.2em}
.envelope-wrap{width:min(84vw,350px);height:245px;margin-top:18px;filter:drop-shadow(0 18px 18px #514a3028)}
.envelope{background:#b8bea3;border-radius:5px;box-shadow:inset 0 0 0 1px #ffffff60}
.env-front{background:linear-gradient(145deg,#cbd0ba,#aab293 78%);clip-path:polygon(0 0,50% 59%,100% 0,100% 100%,0 100%)}
.env-front:after{content:'❀';position:absolute;right:18%;bottom:18%;font-size:32px;color:#f8f5e9;opacity:.78;text-shadow:0 1px 2px #7f866a}
.env-flap{background:linear-gradient(155deg,#d8dac9,#b8bea3)}
.wax{width:49px;height:49px;background:radial-gradient(circle at 35% 25%,#fffdf7,#e8e0ce 65%,#c8bea8);box-shadow:0 3px 7px #5552,inset 0 1px 2px #fff;border:2px solid #eee6d4}
.open-hint{border:0;position:relative;padding:8px 20px;border-radius:99px;background:#e9e8da;color:#687253;letter-spacing:.16em}
.open-hint:before,.open-hint:after{content:'✧';color:#b69a68;margin:0 8px}
.paper-card{max-width:420px;padding:38px 24px 34px;background:linear-gradient(145deg,#fffefa,#fbf8f0);border:1px solid #e6dfce;border-radius:3px;box-shadow:0 15px 38px #544a2b18,0 2px 5px #544a2b0a}
.paper-card:before{inset:9px;border:1px solid #e6dec9}.paper-card:after{inset:13px;border:1px solid #f0eadc}
.paper-card .monogram{width:67px;height:77px;margin-bottom:21px}
.eyebrow{color:#7d8267;letter-spacing:.22em;font-size:9px}
.names{color:#4e503d;font-size:clamp(53px,13vw,70px);text-shadow:0 1px #fff}
.amp{color:#8a886e}
.floral{width:145px;height:158px;margin:8px auto 12px;filter:drop-shadow(0 2px 1px #8b876222)}
.intro{color:#777460;font-size:9px;letter-spacing:.14em;max-width:275px}
.date{color:#555943;font-size:21px;letter-spacing:.19em}
.time{color:#77745f}
.venue{color:#62694d;font-size:14px;letter-spacing:.12em;line-height:1.5}
.address{color:#77745f;font-size:13px}
.maplink{border:0;border-radius:99px;background:#eef0e5;padding:8px 13px;color:#66704f;font-size:9px;letter-spacing:.12em}
.actions{max-width:320px;gap:11px;margin-top:22px}
.btn{border-radius:3px;background:linear-gradient(135deg,#788263,#626e50);border:1px solid #687253;box-shadow:0 4px 10px #58604420;padding:15px 18px;letter-spacing:.14em;font-size:9px}
.btn.secondary{background:#f8f6ee;color:#687253;border:1px solid #bfc3aa;box-shadow:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 14px #58604426}
.section-banner{height:142px;margin-bottom:30px;background:linear-gradient(110deg,#566248,#7c8668 45%,#59654b);}
.section-banner:before,.section-banner:after{border-color:#ffffff40;width:220px;height:220px}
.section-banner span{font-size:49px;text-shadow:0 2px 8px #20271935}
.section-banner:after{content:'✧';border:0;width:auto;height:auto;top:12px;right:25px;font-size:36px;color:#e6dfc8;opacity:.75}
#details .eyebrow{background:#eef0e5;border-radius:99px;padding:8px 15px}
#details .small-title{font-size:22px;color:#555943;letter-spacing:.12em}
.details-grid{gap:14px}
.detail{position:relative;background:linear-gradient(145deg,#fffdf8,#f5f3e9);border:1px solid #e2dfcf;border-radius:4px;padding:19px 14px;box-shadow:0 5px 15px #544a2b0c}
.detail:before{content:'✿';position:absolute;right:13px;top:7px;color:#c5c5ac;font-size:15px;opacity:.8}
.detail h3{font-size:31px;color:#788263}
.detail p{font-size:9px;color:#77745f;letter-spacing:.09em}
.dress{background:#eef0e5;border:1px solid #d4d8c5;border-radius:3px;min-width:170px;padding:14px 25px;box-shadow:0 5px 15px #544a2b0c}
.dress strong{font-size:29px;color:#687253}
#rsvp{background:radial-gradient(ellipse at 50% 8%,#fffefa,#f8f4e9 65%,#eee9dc)}
#rsvp:before{content:'✿';position:absolute;top:7%;right:9%;font-size:25px;color:#b8bea3;opacity:.6}
#rsvp:after{content:'✧';position:absolute;bottom:10%;left:9%;font-size:30px;color:#b69a68;opacity:.6}
.rsvp-title{color:#555440;font-size:clamp(50px,12vw,64px);text-shadow:0 1px #fff}
.rsvp-copy{color:#77745f;letter-spacing:.1em}
.form{background:#fffdf8c9;border:1px solid #e8e2d4;padding:18px;border-radius:4px;box-shadow:0 8px 22px #544a2b0c}
.form label{color:#77745f;font-size:9px;letter-spacing:.12em;text-transform:uppercase}
.form input,.form select{border-radius:3px;border-color:#d9d5c5;background:#fffefa;padding:14px;font-size:15px}
.form input:focus,.form select:focus{border-color:#8b9674;box-shadow:0 0 0 3px #b7bea233}
.back{padding:9px 15px;border-radius:99px;background:#eef0e5}
.footer{color:#9b967f}
.fade-in{animation:softRise .8s cubic-bezier(.2,.75,.25,1) both}@keyframes softRise{from{opacity:0;transform:translateY(14px) scale(.99)}to{opacity:1;transform:none}}
@media(min-width:600px){.site{border:1px solid #e2dccd}.screen{padding-left:42px;padding-right:42px}}


/* Final art direction: handmade wedding stationery, floral and delicate */
:root{--paper:#faf7ef;--sage:#b8bea2;--sage-dark:#687253;--ink:#454536;--gold:#b9a174;--muted:#827d69;--rose:#e9ded2;--cream:#fffdf8}
body{background:#e7e1d4;background-image:radial-gradient(ellipse at 8% 18%,#c9cbb8 0,transparent 32%),radial-gradient(ellipse at 92% 82%,#d8c8b7 0,transparent 30%),linear-gradient(135deg,#e9e3d7,#ded8ca)}
.site{background-color:var(--paper);background-image:repeating-linear-gradient(0deg,#8e85600a 0,#8e85600a 1px,transparent 1px,transparent 5px),linear-gradient(145deg,#fffdf8,#f7f2e7);box-shadow:0 22px 70px #51483226}
.screen{isolation:isolate}
.screen:before{content:'✧';position:absolute;z-index:-1;color:#b9a77b;opacity:.36;font-size:25px;top:7%;left:9%;text-shadow:22px 16px 0 #aeb69a}
.screen:after{content:'❧';position:absolute;z-index:-1;color:#8b9675;opacity:.19;font:54px Georgia,serif;right:3%;bottom:5%;transform:rotate(-28deg)}
.envelope-screen{background:radial-gradient(ellipse at 50% 15%,#fffefa 0,#f7f2e7 60%,#e9e4d7 100%)}
.envelope-screen h1{font-size:clamp(46px,11vw,60px);line-height:1.1;margin-bottom:9px}
.envelope-screen p{font-size:9px;letter-spacing:.24em;margin-bottom:20px}
.monogram{width:88px;height:100px;border:1px solid #b69b69;background:linear-gradient(145deg,#fffefa,#eee7d7);box-shadow:0 7px 18px #786b4b20,inset 0 0 0 4px #fbf8f0,inset 0 0 0 5px #d9c9a7}
.monogram:before{content:'✦';position:absolute;top:-9px;left:calc(50% - 6px);font-size:11px;color:#b69a68;background:var(--paper);padding:0 3px}
.envelope-wrap{height:250px;margin-top:5px}
.envelope{background:#b7bea1;border:1px solid #9da587;box-shadow:inset 0 0 0 1px #ffffff55}
.envelope:before{content:'';position:absolute;inset:9px;border:1px solid #ffffff55;z-index:1;pointer-events:none}
.env-front{background:linear-gradient(145deg,#cbd0ba 0%,#b7bea0 55%,#a4ad8c 100%)}
.env-front:after{content:'❀  ·  S F  ·  ❀';position:absolute;left:0;right:0;bottom:23px;text-align:center;color:#f9f6eb;opacity:.88;font:13px 'Cormorant Garamond',serif;letter-spacing:.22em}
.env-flap{background:linear-gradient(155deg,#d9dbc9,#b9c0a4);filter:drop-shadow(0 2px 2px #69705218)}
.wax{width:54px;height:54px;background:radial-gradient(circle at 32% 25%,#fffef9,#eee7d6 55%,#c8bea8 100%);border:2px solid #f8f2e4;box-shadow:0 3px 8px #51482f40,inset 0 0 0 1px #c5b99e}
.wax:after{content:'S';font:italic 23px 'Cormorant Garamond',serif;color:#9b8b67;text-shadow:0 1px #fff}
.open-hint{background:#eef0e5;border:1px solid #dce0cf;box-shadow:0 4px 12px #565c3c0d;padding:10px 20px}
.paper-card{border:1px solid #e4dcc9;outline:1px solid #fffdf8;outline-offset:4px;background:linear-gradient(145deg,#fffefa,#fbf8f0);box-shadow:0 18px 42px #544a2b1c,0 3px 8px #544a2b0b}
.paper-card:before{inset:10px;border:1px solid #e5dcc7}.paper-card:after{inset:15px;border:1px solid #f0eadc}
.names{font-size:clamp(55px,13vw,72px);margin-top:8px}
.floral{width:152px;height:165px;margin:10px auto 13px}
.date{font-size:22px;letter-spacing:.17em}
.venue{font-size:13px;letter-spacing:.10em;max-width:300px;margin-left:auto;margin-right:auto}
.address{display:inline-block;margin-top:2px;font-size:13px}
.maplink{background:#eef0e5;border:1px solid #e0e3d4;padding:9px 14px;margin-top:12px}
.section-banner{height:155px;background:linear-gradient(120deg,#4f5b43 0%,#879174 48%,#59654b 100%);box-shadow:0 8px 20px #424c351f}
.section-banner:before{width:260px;height:260px;left:-80px;top:-125px;border:1px solid #ffffff55;box-shadow:0 0 0 7px #ffffff0b,0 0 0 14px #ffffff0b}
.section-banner:after{content:'✾';border:0;width:auto;height:auto;right:22px;top:7px;font-size:48px;color:#f1ead8;opacity:.55}
.section-banner span{font-size:52px;letter-spacing:.02em}
#details{background:linear-gradient(180deg,#faf7ef,#f7f2e7)}
#details .eyebrow{background:#eef0e5;border:1px solid #e0e3d3}
#details .small-title{font-size:25px;font-style:italic}
.details-grid{gap:17px}
.detail{border:1px solid #e4dece;border-radius:5px;background:linear-gradient(145deg,#fffefa,#f5f2e8);box-shadow:0 8px 20px #4d482c0d;padding:22px 15px}
.detail:before{content:'❧';font:25px Georgia,serif;color:#aab196;right:13px;top:7px}
.detail h3{font-size:34px}
.detail p{font-size:9px;line-height:2}
.dress{background:#eef0e5;border:1px solid #d7dbc9;box-shadow:0 6px 16px #4d482c0d}
#rsvp{background:radial-gradient(ellipse at 50% 10%,#fffefa 0,#f8f4e9 62%,#eee8da 100%)}
#rsvp .eyebrow{padding:8px 18px;background:#eef0e5;border:1px solid #dfe2d3;border-radius:99px}
.rsvp-title{font-size:clamp(53px,13vw,68px);margin-top:18px}
.rsvp-copy{max-width:300px;line-height:2}
.form{position:relative;border:1px solid #e1dac9;border-radius:5px;background:#fffdf8e8;padding:22px 18px;box-shadow:0 12px 28px #51483212}
.form:before{content:'✿';position:absolute;right:15px;top:-15px;color:#aab196;background:#faf7ef;padding:0 5px;font-size:21px}
.form input,.form select{border:1px solid #ded8c9;background:#fffefa;border-radius:3px}
.btn{border-radius:2px;letter-spacing:.13em}
.back{background:#eef0e5;border:1px solid #e0e3d4}
.footer{letter-spacing:.16em}
@media(max-width:380px){.screen{padding-left:18px;padding-right:18px}.paper-card{padding-left:18px;padding-right:18px}.names{font-size:53px}.venue{font-size:11px}}


/* Final stationery polish: match the Save the Date artwork */
.page-monogram{
  width:78px;height:90px;margin:0 auto 20px;flex:0 0 auto;
  border:1px solid #b99b64;border-radius:48%;
  background:linear-gradient(145deg,#fffefb 8%,#f2ecdf 55%,#fffdf7 100%);
  box-shadow:0 5px 10px #796b4a20,0 1px 2px #fff inset,
    inset 0 0 0 4px #fbf8f0,inset 0 0 0 5px #d7c39b,
    0 2px 0 #d4c19a;
  position:relative;
}
.page-monogram:before{
  content:'';position:absolute;inset:-3px;border:1px solid #d7c39b;
  border-radius:inherit;box-shadow:0 2px 3px #7d6b4720;
}
.page-monogram:after{
  content:'';position:absolute;inset:7px;border:1px solid #dfd1b3;
  border-radius:inherit;
}
.page-monogram span{
  font:400 23px 'Cormorant Garamond',serif;letter-spacing:.08em;
  color:#8d7548;text-shadow:0 1px #fff;z-index:2;
}
.details-screen,.rsvp-screen{
  background:
    radial-gradient(ellipse at 10% 8%,#e9e6d8 0,transparent 30%),
    radial-gradient(ellipse at 92% 92%,#eee3d5 0,transparent 28%),

.envelope-wrap.open .bouquet {
  transition: transform .9s ease, opacity .7s ease;
}
.envelope-wrap.open .bouquet-right { transform: translate(5px,-4px) rotate(4deg) !important; }
.envelope-wrap.open .bouquet-left { transform: translate(-5px,4px) scaleX(-1) rotate(-5deg) !important; }

@media (prefers-reduced-motion: reduce) {
  .env-flap, .env-letter, .wax, .bouquet { transition-duration: .01ms !important; }

<form class="form" id="rsvpForm" novalidate="">
<label for="attendance">Você estará conosco?</label>
<select id="attendance" name="attendance" required="">
<option disabled="" selected="" value="">Selecione uma opção</option>
<option value="Sim, confirmo minha presença!">Sim, confirmo minha presença!</option>
<option value="Infelizmente, não poderei comparecer.">Infelizmente, não poderei comparecer.</option>
</select>
<div class="guest-name-field" hidden="" id="guestNameField">
<label for="guestName">Seu nome completo</label>
<input autocomplete="name" id="guestName" name="guestName" placeholder="Digite seu nome" type="text"/>
</div>
<div class="companions-control" hidden="" id="companionsControl">
<label for="companionCount">Quantos acompanhantes quer levar?</label>
<p class="companions-help">Clique em + ou − para adicionar ou retirar acompanhantes.</p>
<div class="counter">
<button aria-label="Retirar um acompanhante" class="counter-btn" id="removeCompanion" type="button">−</button>
<output aria-live="polite" id="companionCount">1</output>
<button aria-label="Adicionar um acompanhante" class="counter-btn" id="addCompanion" type="button">+</button>
</div>
<div class="companion-fields" id="companionFields"></div>
</div>
<p aria-live="polite" class="rsvp-error" id="rsvpError" role="alert"></p>
<button class="btn" hidden="" id="rsvpSubmit" type="submit">ENVIAR CONFIRMAÇÃO PELO WHATSAPP</button>
</form>
<p aria-live="polite" class="rsvp-success-message" hidden="" id="rsvpSuccess" role="status">Obrigado! Sua confirmação foi enviada.</p>
<p class="rsvp-whatsapp-fallback" hidden="" id="rsvpWhatsappFallback">
      Se o WhatsApp não abriu automaticamente,
      <a href="#" id="rsvpWhatsappLink" rel="noopener" target="_blank">toque aqui para enviar sua confirmação.</a>
</p>
<p class="footer">A CONFIRMAÇÃO SERÁ ENVIADA DIRETAMENTE AOS NOIVOS</p>
<button class="back" onclick="showScreen('invitation')">← Voltar ao convite</button>
</section>
</main>
<script id="google-sheets-config">
  // Depois de publicar o Apps Script como Aplicativo da Web,
  // cole a URL terminada em /exec abaixo.
  window.GOOGLE_SHEETS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzedpEDD3XtMw4rRUPFvinBmewRLaUbmvPdEIPp0QT02TaSaFnBMZYGPaPmr6d3LvBLTQ/exec";
</script>
<script>
(() => {
  const envelope = document.getElementById('envelope');
  const rsvpForm = document.getElementById('rsvpForm');
  let isOpening = false;

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(screen => {
      screen.classList.add('hidden');
      screen.classList.remove('fade-in');
    });
    const target = document.getElementById(id);
    if (!target) return;
    target.classList.remove('hidden');
    requestAnimationFrame(() => target.classList.add('fade-in'));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function openInvite() {
    if (isOpening) return;
    isOpening = true;
    const cover = envelope.closest('.envelope-screen');
    if (cover) cover.classList.add('cover-transition');
    envelope.classList.add('transition-out');

    // Apenas uma transição suave entre a capa e o convite.
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    window.setTimeout(() => showScreen('invitation'), reducedMotion ? 30 : 650);
  }

  envelope.addEventListener('click', openInvite);
  envelope.addEventListener('keydown', event => {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      openInvite();
    }
  });

  if (rsvpForm) {
    const guestName = document.getElementById('guestName');
    const guestNameField = document.getElementById('guestNameField');
    const guestNameLabel = guestNameField.querySelector('label');
    const attendance = document.getElementById('attendance');
    const companionFields = document.getElementById('companionFields');
    const companionCount = document.getElementById('companionCount');
    const companionsControl = document.getElementById('companionsControl');
    const rsvpError = document.getElementById('rsvpError');
    const rsvpSuccess = document.getElementById('rsvpSuccess');
    const rsvpWhatsappFallback = document.getElementById('rsvpWhatsappFallback');
    const rsvpWhatsappLink = document.getElementById('rsvpWhatsappLink');
    const rsvpSubmit = document.getElementById('rsvpSubmit');
    let companions = 0;

    function renderCompanions() {
      companionCount.textContent = companions;
      document.getElementById('removeCompanion').disabled = companions <= 0;
      document.getElementById('addCompanion').disabled = companions === 10;
      companionFields.innerHTML = '';
      for (let i = 1; i <= companions; i++) {
        const wrapper = document.createElement('div');
        wrapper.className = 'companion-field';
        const label = document.createElement('label');
        label.htmlFor = `companion${i}`;
        label.textContent = `Acompanhante ${i}`;
        const input = document.createElement('input');
        input.type = 'text';
        input.id = `companion${i}`;
        input.name = `companion${i}`;
        input.placeholder = `Nome do acompanhante ${i}`;
        input.autocomplete = 'off';
        input.addEventListener('input', () => {
          label.classList.remove('field-invalid');
          input.classList.remove('input-invalid');
          rsvpError.textContent = '';
        });
        wrapper.append(label, input);
        companionFields.appendChild(wrapper);
      }
    }

    function clearValidation() {
      rsvpError.textContent = '';
      guestNameLabel.classList.remove('field-invalid');
      guestName.classList.remove('input-invalid');
      document.querySelectorAll('.field-invalid').forEach(el => el.classList.remove('field-invalid'));
      document.querySelectorAll('.input-invalid').forEach(el => el.classList.remove('input-invalid'));
    }

    document.getElementById('addCompanion').addEventListener('click', () => {
      if (companions < 10) { companions++; renderCompanions(); }
    });
    document.getElementById('removeCompanion').addEventListener('click', () => {
      if (companions > 0) { companions--; renderCompanions(); }
    });

    attendance.addEventListener('change', () => {
      const attending = attendance.value === 'Sim, confirmo minha presença!';
      guestNameField.hidden = false;
      rsvpSubmit.hidden = false;
      companionsControl.hidden = !attending;
      clearValidation();
      if (attending) {
        companions = 1;
        renderCompanions();
      } else {
        companions = 0;
        companionFields.innerHTML = '';
        companionCount.textContent = '0';
      }
    });

    rsvpForm.addEventListener('submit', event => {
      event.preventDefault();
      clearValidation();
      const name = guestName.value.trim();
      const answer = attendance.value;
      if (!answer) {
        rsvpError.textContent = 'Selecione se você poderá estar presente para continuar.';
        attendance.focus();
        return;
      }
      if (!name) {
        guestNameLabel.classList.add('field-invalid');
        guestName.classList.add('input-invalid');
        rsvpError.textContent = 'Por favor, informe seu nome para identificarmos sua confirmação.';
        guestName.scrollIntoView({ behavior: 'smooth', block: 'center' });
        guestName.focus({ preventScroll: true });
        return;
      }

      const companionNames = [];
      if (answer === 'Sim, confirmo minha presença!') {
        let firstEmpty = null;
        for (let i = 1; i <= companions; i++) {
          const input = document.getElementById(`companion${i}`);
          if (!input.value.trim()) {
            const label = document.querySelector(`label[for="companion${i}"]`);
            label.classList.add('field-invalid');
            input.classList.add('input-invalid');
            if (!firstEmpty) firstEmpty = input;
          } else {
            companionNames.push(input.value.trim());
          }
        }
        if (firstEmpty) {
          rsvpError.textContent = 'Ainda falta informar o nome de um ou mais acompanhantes. Preencha os campos destacados em vermelho ou use o botão − para retirar quem não vai acompanhar você.';
          firstEmpty.scrollIntoView({ behavior: 'smooth', block: 'center' });
          firstEmpty.focus({ preventScroll: true });
          return;
        }
      }

      const endpoint = window.GOOGLE_SHEETS_WEB_APP_URL;
      if (!endpoint) {
        rsvpError.classList.add('rsvp-failure');
        rsvpError.textContent = 'A integração com a planilha ainda não foi configurada. Tente novamente mais tarde.';
        return;
      }

      const payload = new URLSearchParams();
      payload.set('guestName', name);
      payload.set('attendance', answer);
      payload.set('companionCount', String(companionNames.length));
      payload.set('companions', JSON.stringify(companionNames));
      payload.set('source', 'Convite Sarah & Fellipe');

      rsvpSubmit.disabled = true;
      rsvpSubmit.textContent = 'ENVIANDO...';

      // Abre o WhatsApp imediatamente durante o clique do usuário.
      // Isso evita que o navegador bloqueie a abertura após o retorno assíncrono do Sheets.
      const whatsappLines = [
        'Olá, Sarah e Fellipe!',
        '',
        'Segue minha confirmação de presença:',
        `Nome: ${name}`,
        `Resposta: ${answer}`,
        ...(answer === 'Sim, confirmo minha presença!'
          ? [`Acompanhantes (${companionNames.length}): ${companionNames.length ? companionNames.join(', ') : 'Nenhum'}`]
          : [])
      ];
      const whatsappUrl = 'https://api.whatsapp.com/send?phone=5541988571657&text=' +
        encodeURIComponent(whatsappLines.join('\n'));

      // A abertura ocorre de forma síncrona, ainda dentro do gesto do usuário.
      const whatsappWindow = window.open(whatsappUrl, '_blank');

      // Deixa também um link manual disponível caso o navegador bloqueie a nova aba.
      rsvpWhatsappLink.href = whatsappUrl;
      rsvpWhatsappFallback.hidden = !!whatsappWindow;

      fetch(endpoint, {
        method: 'POST',
        mode: 'no-cors',
        body: payload
      }).then(() => {
        // A abertura do WhatsApp já foi iniciada no clique; aqui finalizamos a confirmação na página.
        rsvpForm.reset();
        rsvpForm.hidden = true;
        rsvpSuccess.hidden = false;
        companions = 0;
        companionFields.innerHTML = '';
        companionCount.textContent = '0';
      }).catch(() => {
        rsvpError.classList.remove('rsvp-success');
        rsvpError.classList.add('rsvp-failure');
        rsvpError.textContent = 'Não foi possível enviar agora. Verifique sua conexão e tente novamente.';
      }).finally(() => {
        rsvpSubmit.disabled = false;
        rsvpSubmit.textContent = 'ENVIAR CONFIRMAÇÃO PELO WHATSAPP';
      });
    });
  }

  // Permite que os botões existentes continuem chamando showScreen.
  window.showScreen = showScreen;
})();

</script>
